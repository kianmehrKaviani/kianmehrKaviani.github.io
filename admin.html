<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کاربران</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: #f0f2f5;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .admin-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 20px 0;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
            border-right: 4px solid #667eea;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-table-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }
        .table thead th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
        }
        .table tbody td {
            vertical-align: middle;
            padding: 12px 15px;
        }
        .table tbody tr:hover {
            background-color: #f8f9ff;
            transition: all 0.3s;
        }
        .badge-status {
            background: #28a745;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .btn-danger {
            background: #dc3545;
            border: none;
            transition: all 0.3s;
        }
        .btn-danger:hover {
            background: #c82333;
            transform: scale(1.05);
        }
        .back-link {
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            background: rgba(255,255,255,0.15);
            border-radius: 25px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: rgba(255,255,255,0.25);
            color: white;
        }
        .search-box {
            border-radius: 25px;
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .search-box:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }
        .empty-state i {
            font-size: 4rem;
            color: #ddd;
        }
        .protection-badge {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #4ade80;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #4ade80;
        }
    </style>
</head>
<body>

<!-- نشان امنیت -->
<div class="protection-badge">
    <i class="bi bi-shield-lock-fill"></i> دسترسی محدود
</div>

<div class="container">
    <!-- هدر -->
    <div class="admin-header p-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="mb-0">
                    <i class="bi bi-people-fill"></i> پنل مدیریت کاربران
                </h1>
                <small class="text-light opacity-75">
                    <i class="bi bi-clock"></i> آخرین بروزرسانی: <span id="lastUpdate"></span>
                </small>
            </div>
            <div>
                <a href="index.html" class="back-link">
                    <i class="bi bi-arrow-right"></i> بازگشت به فرم ثبت نام
                </a>
            </div>
        </div>
    </div>

    <!-- آمار -->
    <div class="row mb-4">
        <div class="col-md-3 mb-3">
            <div class="stat-card">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1">تعداد کل کاربران</p>
                        <span class="stat-number" id="totalUsers">0</span>
                    </div>
                    <i class="bi bi-people fs-1 text-primary opacity-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="stat-card" style="border-right-color: #28a745;">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1">ثبت نام امروز</p>
                        <span class="stat-number" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;" id="todayUsers">0</span>
                    </div>
                    <i class="bi bi-calendar-check fs-1 text-success opacity-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="stat-card" style="border-right-color: #ffc107;">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1">این هفته</p>
                        <span class="stat-number" style="background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;" id="weekUsers">0</span>
                    </div>
                    <i class="bi bi-calendar-week fs-1 text-warning opacity-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="stat-card" style="border-right-color: #dc3545;">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1">آخرین کاربر</p>
                        <span class="stat-number" style="font-size: 1.2rem; -webkit-text-fill-color: #333;" id="lastUser">-</span>
                    </div>
                    <i class="bi bi-person-plus fs-1 text-danger opacity-50"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- جدول کاربران -->
    <div class="user-table-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">
                <i class="bi bi-list-ul"></i> لیست کاربران
            </h4>
            <div class="d-flex gap-2">
                <input type="text" class="search-box" id="searchInput" placeholder="جستجوی کاربر..." onkeyup="searchUsers()">
                <button class="btn btn-outline-danger" onclick="deleteAllUsers()">
                    <i class="bi bi-trash3"></i> حذف همه
                </button>
                <button class="btn btn-outline-success" onclick="exportData()">
                    <i class="bi bi-download"></i> خروجی
                </button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>نام و نام خانوادگی</th>
                        <th>ایمیل</th>
                        <th>شماره تماس</th>
                        <th>تاریخ ثبت نام</th>
                        <th>ساعت</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- کاربران توسط JavaScript اضافه می‌شوند -->
                </tbody>
            </table>
        </div>

        <!-- حالت خالی -->
        <div id="emptyState" class="empty-state d-none">
            <i class="bi bi-inbox"></i>
            <h5 class="mt-3 text-muted">هنوز کاربری ثبت نام نشده است</h5>
            <p class="text-muted">کاربران پس از ثبت نام در اینجا نمایش داده می‌شوند</p>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let users = [];
    let filteredUsers = [];

    // بارگذاری کاربران
    function loadUsers() {
        const storedUsers = localStorage.getItem('registeredUsers');
        if (storedUsers) {
            users = JSON.parse(storedUsers);
            filteredUsers = [...users];
        } else {
            users = [];
            filteredUsers = [];
        }
        renderUsers();
        updateStats();
    }

    // ذخیره کاربران
    function saveUsers() {
        localStorage.setItem('registeredUsers', JSON.stringify(users));
    }

    // رندر جدول
    function renderUsers() {
        const tbody = document.getElementById('usersTableBody');
        const emptyState = document.getElementById('emptyState');

        if (filteredUsers.length === 0) {
            tbody.innerHTML = '';
            emptyState.classList.remove('d-none');
            return;
        }

        emptyState.classList.add('d-none');
        
        let html = '';
        filteredUsers.forEach((user, index) => {
            const realIndex = users.indexOf(user);
            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${user.firstName} ${user.lastName}</strong></td>
                    <td><i class="bi bi-envelope text-muted"></i> ${user.email}</td>
                    <td><i class="bi bi-phone text-muted"></i> ${user.phone}</td>
                    <td>${user.registerDate || 'نامشخص'}</td>
                    <td>${user.registerTime || 'نامشخص'}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteUser(${realIndex})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    // جستجو
    function searchUsers() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        if (query === '') {
            filteredUsers = [...users];
        } else {
            filteredUsers = users.filter(user => 
                user.firstName.toLowerCase().includes(query) ||
                user.lastName.toLowerCase().includes(query) ||
                user.email.toLowerCase().includes(query) ||
                user.phone.includes(query)
            );
        }
        renderUsers();
    }

    // حذف کاربر
    function deleteUser(index) {
        if (confirm('آیا از حذف این کاربر مطمئن هستید؟')) {
            users.splice(index, 1);
            saveUsers();
            filteredUsers = [...users];
            renderUsers();
            updateStats();
        }
    }

    // حذف همه کاربران
    function deleteAllUsers() {
        if (users.length === 0) {
            alert('هیچ کاربری برای حذف وجود ندارد!');
            return;
        }
        if (confirm('آیا از حذف همه کاربران مطمئن هستید؟ این عمل غیرقابل بازگشت است!')) {
            users = [];
            saveUsers();
            filteredUsers = [];
            renderUsers();
            updateStats();
        }
    }

    // بروزرسانی آمار
    function updateStats() {
        document.getElementById('totalUsers').textContent = users.length;
        
        // امروز
        const today = new Date().toLocaleDateString('fa-IR');
        const todayUsers = users.filter(user => user.registerDate === today).length;
        document.getElementById('todayUsers').textContent = todayUsers;
        
        // این هفته
        const now = new Date();
        const weekStart = new Date(now);
        weekStart.setDate(now.getDate() - now.getDay() + 1);
        const weekUsers = users.filter(user => {
            if (!user.registerDate) return false;
            const userDate = new Date(user.registerDate.split('/').reverse().join('/'));
            return userDate >= weekStart;
        }).length;
        document.getElementById('weekUsers').textContent = weekUsers;
        
        // آخرین کاربر
        if (users.length > 0) {
            const last = users[users.length - 1];
            document.getElementById('lastUser').textContent = `${last.firstName} ${last.lastName}`;
        } else {
            document.getElementById('lastUser').textContent = '-';
        }

        // آخرین بروزرسانی
        document.getElementById('lastUpdate').textContent = new Date().toLocaleString('fa-IR');
    }

    // خروجی گرفتن از داده‌ها
    function exportData() {
        if (users.length === 0) {
            alert('هیچ کاربری برای خروجی گرفتن وجود ندارد!');
            return;
        }
        const dataStr = JSON.stringify(users, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `users_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // بارگذاری اولیه
    loadUsers();

    // بروزرسانی خودکار هر 30 ثانیه
    setInterval(() => {
        loadUsers();
    }, 30000);
</script>

</body>
</html>
