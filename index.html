<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ثبت نام</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: none;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .toast-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
        }
        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            opacity: 0.3;
            transition: all 0.3s;
            font-size: 0.8rem;
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
        }
        .admin-link:hover {
            opacity: 1;
            background: rgba(0,0,0,0.6);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-person-plus"></i> فرم ثبت نام
                </div>
                <div class="card-body p-4">
                    <form id="registerForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label fw-bold">
                                    <i class="bi bi-person"></i> نام
                                </label>
                                <input type="text" class="form-control" id="firstName" placeholder="نام" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label fw-bold">
                                    <i class="bi bi-person"></i> نام خانوادگی
                                </label>
                                <input type="text" class="form-control" id="lastName" placeholder="نام خانوادگی" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">
                                <i class="bi bi-envelope"></i> ایمیل
                            </label>
                            <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label fw-bold">
                                <i class="bi bi-phone"></i> شماره تماس
                            </label>
                            <input type="tel" class="form-control" id="phone" placeholder="0912 345 6789" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">
                                <i class="bi bi-lock"></i> رمز عبور
                            </label>
                            <input type="password" class="form-control" id="password" placeholder="حداقل ۶ کاراکتر" required minlength="6">
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="reset" class="btn btn-secondary me-md-2">
                                <i class="bi bi-arrow-counterclockwise"></i> پاک کردن
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check2-circle"></i> ثبت نام
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- لینک مخفی به صفحه مدیریت -->
<a href="admin.html" class="admin-link" title="ورود به پنل مدیریت">
    <i class="bi bi-shield-lock"></i> مدیریت
</a>

<!-- Toast notification -->
<div class="toast-container">
    <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle-fill me-2"></i> با موفقیت ثبت نام کردید! 🎉
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let users = [];

    function loadUsers() {
        const storedUsers = localStorage.getItem('registeredUsers');
        if (storedUsers) {
            users = JSON.parse(storedUsers);
        }
    }

    function saveUsers() {
        localStorage.setItem('registeredUsers', JSON.stringify(users));
    }

    function showToast(message) {
        const toast = document.getElementById('successToast');
        const bsToast = new bootstrap.Toast(toast);
        toast.querySelector('.toast-body').innerHTML = `<i class="bi bi-check-circle-fill me-2"></i> ${message}`;
        bsToast.show();
    }

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;

        if (!firstName || !lastName || !email || !phone || !password) {
            alert('لطفاً تمام فیلدها را پر کنید!');
            return;
        }

        if (password.length < 6) {
            alert('رمز عبور باید حداقل ۶ کاراکتر باشد!');
            return;
        }

        if (users.some(user => user.email === email)) {
            alert('این ایمیل قبلاً ثبت نام کرده است!');
            return;
        }

        const newUser = {
            id: Date.now(),
            firstName,
            lastName,
            email,
            phone,
            registerDate: new Date().toLocaleDateString('fa-IR'),
            registerTime: new Date().toLocaleTimeString('fa-IR')
        };

        users.push(newUser);
        saveUsers();
        showToast('با موفقیت ثبت نام کردید! 🎉');
        document.getElementById('registerForm').reset();
    });

    loadUsers();
</script>

</body>
</html>
