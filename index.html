<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Top 100 Football Players</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="index.html"
            class="navbar-brand fw-bold">

            ⚽ Football Players

        </a>

    </div>

</nav>



<!-- Main -->

<main class="container py-5">


    <!-- Title -->

    <h1 class="text-center fw-bold mb-2">

        Top 100 Football Players

    </h1>


    <p class="text-center text-secondary mb-5">

        Search for a player

    </p>



    <!-- Search -->

    <div class="search-container mb-4">


        <div class="input-group input-group-lg">


            <input
                id="searchInput"
                type="text"
                class="form-control"
                placeholder="Search player..."
                autocomplete="off">


            <button
                id="searchButton"
                class="btn btn-primary"
                type="button">

                🔍 Search

            </button>


        </div>



        <!-- Search suggestions -->

        <div
            id="searchResults"
            class="search-results">
        </div>


    </div>



    <!-- Result count -->

    <div
        id="resultInfo"
        class="mb-4 text-secondary">

    </div>



    <!-- Players -->

    <div
        id="playersContainer"
        class="row g-4">

    </div>


</main>



<!-- JavaScript -->

<script src="./players.js"></script>

<script src="./script.js"></script>


</body>

</html>
